name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rls-smoke:
    name: RLS + lockdown smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -c "create database ledgerpro;"
      - name: Apply migrations + run smoke test
        env:
          PGPASSWORD: postgres
          # Exercises the real lockdown against Supabase-equivalent default privileges and
          # fails the build if any RLS / balance-trigger / RPC-execute check goes red.
          PSQL_DSN: postgresql://postgres:postgres@localhost:5432/ledgerpro
        run: bash scripts/localpg/run_smoke.sh
